name: Gated PyPI release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    # Disabled until an approved release configures this variable, private terms,
    # Trusted Publishing and the protected environment's required reviewer.
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' && !github.event.release.prerelease }}
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: '1.15.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: sfw pip install '.[test]' build==1.6.1 'setuptools>=77' wheel
      - name: Require a matching stable release tag
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if 'dev' in version or os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('a matching stable release tag is required')
          PY
      - name: Require released provider-key protection
        run: |
          python - <<'PYCODE'
          import pathlib, tomllib
          from importlib.metadata import version
          from packaging.version import Version
          from push_guard import scan_text_for_secrets
          deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          if 'push-guard>=0.4.3,<0.5' not in deps or Version(version('push-guard')) < Version('0.4.3'):
              raise SystemExit('release requires the reviewed Push Guard 0.4.3 minimum')
          for kind in ('proj', 'svcacct', 'admin', 'ant-api03', 'ant-admin01', 'ant-oat01', 'ant-ort01'):
              label = 's' + 'k-' + kind + '-' + 'Ab3dE5fG7hJ9kL2mN4pQ6rS8' + '.invalid'
              if not any(f.rule_id.startswith('secret.') for f in scan_text_for_secrets(label)):
                  raise SystemExit('installed provider-key protection is incomplete')
          PYCODE
      - run: PYTHONPATH=src python -m pytest -q
      - run: push-guard scan --base origin/main --head HEAD --no-infer
      - run: python -m build --no-isolation
      - name: Full distribution and private-term gate
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: push-guard scan-package --no-infer --require-explicit-terms --min-terms 3 dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
