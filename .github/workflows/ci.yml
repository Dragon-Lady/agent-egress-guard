name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: '1.15.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install through Socket Firewall
        run: sfw pip install '.[test]' build==1.6.1 'setuptools>=77' wheel
      - name: Tests and compilation
        run: |
          PYTHONPATH=src python -m pytest -q
          python -m compileall -q src tests
      - name: Inspect outgoing changes
        run: push-guard scan --base origin/main --head HEAD --no-infer
      - name: Build and scan complete distributions
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: |
          python -m build --no-isolation
          push-guard scan-package --no-infer --require-explicit-terms --min-terms 3 dist/*
      - name: Smoke test installed wheel
        run: |
          sfw pip install --force-reinstall --no-deps dist/*.whl
          env -u PYTHONPATH aeg --version
          env -u PYTHONPATH aeg doctor
